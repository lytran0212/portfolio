<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Carousel</title>
    <style>
        body {
            background: #1a2633;
            color: #f6f6f2;
            font-family: 'Quicksand', 'Georgia', serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gallery-section {
            width: 100vw;
            background: #1a2633;
            padding: 5rem 0 6rem 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .gallery-ellipse {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 90vw;
            max-width: 1200px;
            height: 90px;
            background: #1a2633;
            border-radius: 50%/50%;
            opacity: 1;
            z-index: 10;
            pointer-events: none;
            box-shadow: none;
            filter: none;
        }
        .gallery-ellipse-top {
            top: 1.5rem;
        }
        .gallery-ellipse-bottom {
            bottom: 1.5rem;
        }
        .gallery-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2vw;
            width: 100%;
            max-width: 1100px;
            position: relative;
            z-index: 2;
        }
        .gallery-track {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 3vw;
            width: 85vw;
            max-width: 1000px;
            overflow: hidden;
            position: relative;
            transition: transform 0.7s cubic-bezier(.4,2,.6,1);
            padding-left: 140px;
            padding-right: 140px;
            box-sizing: border-box;
        }
        .gallery-img {
            width: 260px;
            height: 180px;
            object-fit: cover;
            border-radius: 18px;
            box-shadow: 0 4px 24px #2228;
            transition: filter 0.6s cubic-bezier(.4,2,.6,1), opacity 0.6s cubic-bezier(.4,2,.6,1), box-shadow 0.6s;
            filter: grayscale(100%) brightness(0.7) blur(1px);
            opacity: 0.7;
            z-index: 5;
            position: relative;
        }
        .gallery-img.active {
            filter: none;
            opacity: 1;
            z-index: 7;
            box-shadow: 0 8px 32px #f3596444, 0 2px 8px #e6d3b355;
        }
        .gallery-img.left, .gallery-img.right {
            filter: grayscale(100%) brightness(0.85) blur(0.5px);
            opacity: 0.85;
            z-index: 6;
        }
        .gallery-img.left { margin-right: -30px; }
        .gallery-img.right { margin-left: -30px; }
        @media (max-width: 900px) {
            .gallery-ellipse { width: 98vw; max-width: 98vw; height: 60px; }
            .gallery-track { width: 98vw; max-width: 98vw; }
            .gallery-img, .gallery-img.active, .gallery-img.left, .gallery-img.right { width: 120px; height: 80px; }
        }
        .gallery-arrow {
            background: #17212b;
            border: 2px dashed #f35964;
            border-radius: 50%;
            width: 56px;
            height: 56px;
            font-size: 2.2rem;
            color: #f35964;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 16px #2228, 0 1.5px 4px 0 #e6d3b355;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            position: relative;
            outline: none;
            border-width: 2.5px;
        }
        .gallery-arrow:hover, .gallery-arrow:focus {
            background: #f35964;
            color: #17212b;
            box-shadow: 0 8px 32px #f3596444, 0 2px 8px #e6d3b355;
            border-color: #f6d89c;
        }
        .gallery-arrow-left {
            margin-right: 2vw;
        }
        .gallery-arrow-right {
            margin-left: 2vw;
        }
    </style>
</head>
<body>
    <section id="gallery" class="gallery-section">
        <div class="gallery-ellipse gallery-ellipse-top"></div>
        <div class="gallery-container">
            <button class="gallery-arrow gallery-arrow-left" aria-label="Previous">&#8592;</button>
            <div class="gallery-track">
                <!-- Gallery images will be injected by JS -->
            </div>
            <button class="gallery-arrow gallery-arrow-right" aria-label="Next">&#8594;</button>
        </div>
        <div class="gallery-ellipse gallery-ellipse-bottom"></div>
    </section>
    <script>
        // Danh sách ảnh mẫu, bạn có thể thay đổi đường dẫn ảnh theo ý muốn
        var galleryImageList = [
            'DupliTone-Cover-Illustrator_1160x.jpg',
            'f2180d2ed5dade0b62f3dfa3346bd66f.jpg',
            'images.png',
            'Black-Magic-Cover_1160x.png',
            '839ef3d59c9906ebc3fa4286b31ca9e2.jpg',
            '01_d44c1e02-e95d-4bdb-b1b7-cd8a2197e37c_1200x1200.png',
            'images (1).png'
        ];
        var galleryTrack = document.querySelector('.gallery-track');
        galleryTrack.innerHTML = galleryImageList.map(function(src, i) {
            return `<img src="${src}" class="gallery-img" alt="Gallery ${i+1}">`;
        }).join('');
        var galleryImgs = document.querySelectorAll('.gallery-img');
        var leftBtn = document.querySelector('.gallery-arrow-left');
        var rightBtn = document.querySelector('.gallery-arrow-right');
        var currentIdx = 0;
        function updateGallery() {
            galleryImgs.forEach(function(img, idx) {
                img.classList.remove('active', 'left', 'right');
                if (idx === currentIdx) {
                    img.classList.add('active');
                } else if (idx === (currentIdx - 1 + galleryImgs.length) % galleryImgs.length) {
                    img.classList.add('left');
                } else if (idx === (currentIdx + 1) % galleryImgs.length) {
                    img.classList.add('right');
                }
            });
            // Slide the track so the active image is centered
            var imgWidth = galleryImgs[0].offsetWidth + parseInt(getComputedStyle(galleryTrack).gap || 0);
            var center = Math.floor(galleryImgs.length / 2);
            var offset = (currentIdx - center) * imgWidth;
            galleryTrack.style.transform = `translateX(${-offset}px)`;
        }
        leftBtn.addEventListener('click', function() {
            currentIdx = (currentIdx - 1 + galleryImgs.length) % galleryImgs.length;
            updateGallery();
        });
        rightBtn.addEventListener('click', function() {
            currentIdx = (currentIdx + 1) % galleryImgs.length;
            updateGallery();
        });
        // Swipe support for mobile
        var startX = 0;
        galleryTrack.addEventListener('touchstart', function(e) {
            startX = e.touches[0].clientX;
        });
        galleryTrack.addEventListener('touchend', function(e) {
            var dx = e.changedTouches[0].clientX - startX;
            if (dx > 40) leftBtn.click();
            if (dx < -40) rightBtn.click();
        });
        // Init
        updateGallery();
    </script>
</body>
</html>
